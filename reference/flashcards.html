<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16181d">
<title>Flashcards Open</title>
<style>
:root{
  --bg:#f4f4f6;--surface:#ffffff;--surface2:#ececf0;--text:#1b1d22;--muted:#6b6f7a;--border:#d9dae0;
  --accent:#3b6fe0;--again:#d64545;--hard:#d98a1c;--good:#2f9e5b;--easy:#3b6fe0;
  --radius:14px;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#16181d;--surface:#20232a;--surface2:#2a2e37;--text:#e8e9ec;--muted:#9a9fab;--border:#353a45;
  --accent:#6f97f2;--again:#e05d5d;--hard:#e0a040;--good:#46b874;--easy:#6f97f2;
}}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
.wrap{max-width:760px;margin:0 auto;padding:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom))}
header{display:flex;align-items:center;gap:10px;margin-bottom:16px}
header h1{font-size:1.3rem;margin:0;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.btn{background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:10px 14px;cursor:pointer;min-height:44px}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.danger{color:var(--again)}
.btn.small{padding:6px 10px;min-height:36px;font-size:.9rem}
.row{display:flex;gap:8px;flex-wrap:wrap}
.card-list{display:flex;flex-direction:column;gap:10px}
.deck{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px;cursor:pointer}
.deck h2{margin:0 0 6px;font-size:1.1rem}
.stats{display:flex;gap:14px;font-size:.9rem;color:var(--muted)}
.stats b{font-weight:600}
.s-new{color:var(--easy)}.s-due{color:var(--good)}.s-learn{color:var(--hard)}
.muted{color:var(--muted)}
.hint{font-size:.85rem;color:var(--muted);margin-top:18px}
.hint code{background:var(--surface2);padding:1px 5px;border-radius:5px}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:14px}
/* study */
#study{display:flex;flex-direction:column;min-height:calc(100vh - 32px);min-height:calc(100dvh - 32px)}
.progress{height:4px;background:var(--surface2);border-radius:4px;overflow:hidden;margin-bottom:12px}
.progress>div{height:100%;background:var(--accent);width:0;transition:width .2s}
.fc{flex:1;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px;overflow:auto;cursor:pointer;font-size:1.15rem}
.fc hr.sep{border:0;border-top:2px dashed var(--border);margin:18px 0}
.md img{max-width:100%;height:auto;border-radius:8px;display:block;margin:8px auto}
.md pre{background:var(--surface2);padding:10px;border-radius:8px;overflow:auto;font-size:.9rem}
.md code{background:var(--surface2);padding:1px 5px;border-radius:5px;font-size:.92em}
.md pre code{background:none;padding:0}
.md table{border-collapse:collapse;max-width:100%;display:block;overflow:auto}
.md th,.md td{border:1px solid var(--border);padding:4px 8px}
.md blockquote{border-left:3px solid var(--accent);margin:8px 0;padding:2px 12px;color:var(--muted)}
.md p:first-child{margin-top:0}.md p:last-child{margin-bottom:0}
.md .missing-img{display:inline-block;border:1px dashed var(--again);color:var(--again);padding:4px 8px;border-radius:6px;font-size:.85rem}
.tags{margin-top:12px;font-size:.8rem;color:var(--muted)}
.answer-bar{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.answer-bar .btn{display:flex;flex-direction:column;align-items:center;padding:8px 4px;color:#fff;border:0;font-weight:600}
.answer-bar .btn small{font-weight:400;opacity:.85;font-size:.75rem}
.b-again{background:var(--again)!important}.b-hard{background:var(--hard)!important}.b-good{background:var(--good)!important}.b-easy{background:var(--easy)!important}
.show-btn{margin-top:12px;width:100%;min-height:56px}
.keys{font-size:.75rem;color:var(--muted);text-align:center;margin-top:6px}
.browse-item{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:10px 12px}
.browse-item .b{border-top:1px solid var(--border);margin-top:8px;padding-top:8px}
input[type=search],input[type=number]{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:10px;width:100%}
.toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top));transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:.9rem;max-width:90vw;z-index:9;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
.hidden{display:none!important}
.done{text-align:center;padding:40px 10px}
.done .big{font-size:2.5rem}
label.fileb{position:relative;overflow:hidden;display:inline-flex;align-items:center}
label.fileb input{position:absolute;inset:0;opacity:0;cursor:pointer}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div class="toast" id="toast"></div>

<script>
"use strict";
/* ================= IndexedDB ================= */
const DB_NAME = "flashcards", DB_VER = 1;
let db;

    const r = indexedDB.open(DB_NAME, DB_VER);
    r.onupgradeneeded = () => {

      d.createObjectStore("decks", {keyPath: "id"});
      const c = d.createObjectStore("cards", {keyPath: "id"});
      c.createIndex("deck", "deckId");
      d.createObjectStore("images", {keyPath: "name"});

}
function tx(store, mode, fn){

}
function reqP(r){ return new Promise((res, rej) => { r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); }
const getAll = (store) => reqP(db.transaction(store).objectStore(store).getAll());
function cardsOf(deckId){
  return new Promise((res, rej) => {
    const r = db.transaction("cards").objectStore("cards").index("deck").getAll(deckId);
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  });
}
const putCard = (c) => tx("cards", "readwrite", s => s.put(c));

/* ================= Helpers ================= */
const $ = (sel, el = document) => el.querySelector(sel);
const esc = (s) => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const DAY = 86400000, MIN = 60000;
function toast(msg, ms = 2500){ const t = $("#toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove("show"), ms); }
function hash(str){ let h = 2166136261; for (let i = 0; i < str.length; i++){ h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); } return (h >>> 0).toString(36); }

const normName = (n) => decodeURIComponent(String(n).split(/[\\/]/).pop().split("?")[0]).trim().normalize("NFC").toLowerCase();
function startOfTomorrow(){ const d = new Date(); d.setHours(24, 0, 0, 0); return d.getTime(); }
function fmtIvl(ms){
  if (ms < 60*MIN) return Math.max(1, Math.round(ms / MIN)) + " min";
  if (ms < DAY) return Math.round(ms / (60*MIN)) + " h";
  const d = ms / DAY;
  if (d < 30) return Math.round(d) + " d";
  if (d < 365) return (d / 30).toFixed(1).replace(".0", "") + " mo";
  return (d / 365).toFixed(1).replace(".0", "") + " y";
}

/* ================= Text decoding (Sonderzeichen) ================= */
function decodeText(buf){

  if (bytes[0] === 0xFF && bytes[1] === 0xFE) return new TextDecoder("utf-16le").decode(bytes.subarray(2));
  if (bytes[0] === 0xFE && bytes[1] === 0xFF) return new TextDecoder("utf-16be").decode(bytes.subarray(2));

  catch(e){ return new TextDecoder("windows-1252").decode(bytes); } // Excel CSV (ANSI)
}

/* ================= CSV ================= */
const HEADER_WORDS = {
  front: ["front","vorderseite","frage","question","begriff","vorne","q","term"],
  back: ["back","rückseite","rueckseite","antwort","answer","definition","hinten","a"],

  })).filter(c => c.front || c.back);

/* ================= Markdown + images ================= */
marked.setOptions({breaks: true, gfm: true});
const urlCache = new Map();
async function imageURL(name){

  const rec = await new Promise(res => { const r = db.transaction("images").objectStore("images").get(key); r.onsuccess = () => res(r.result); r.onerror = () => res(null); });
  const url = rec ? URL.createObjectURL(rec.blob) : null;

}
function preprocess(src){
  // [[image.png]] or ![[image.png]] (Obsidian style) -> Markdown image
  src = src.replace(/!?\[\[([^\]|]+\.(?:png|jpe?g|gif|webp|svg|bmp|avif))(?:\|[^\]]*)?\]\]/gi, (_, n) => `![](${encodeURI(n.trim())})`);

/* ================= Spaced Repetition (SM-2-Variante) ================= */

/* ================= Settings ================= */

}

}

  await tx("images", "readwrite", s => {
    for (const f of files){
      if (!/^image\//.test(f.type) && !/\.(png|jpe?g|gif|webp|svg|bmp|avif)$/i.test(f.name)) continue;
      s.put({name: normName(f.name), blob: f}); n++;
    }
  });
  urlCache.clear();
  toast(n + " image(s) stored");
}

/* ================= Backup ================= */
const blobToDataURL = (b) => new Promise(res => { const r = new FileReader(); r.onload = () => res(r.result); r.readAsDataURL(b); });
async function exportBackup(){
  const decks = await getAll("decks"), cards = await getAll("cards"), imgs = await getAll("images"), meta = await getAll("meta");
  const images = [];
  for (const i of imgs) images.push({name: i.name, data: await blobToDataURL(i.blob)});
  const blob = new Blob([JSON.stringify({app: "flashcards", v: 1, at: new Date().toISOString(), decks, cards, images, meta})], {type: "application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "flashcards-backup-" + new Date().toISOString().slice(0, 10) + ".json";
  document.body.appendChild(a); a.click(); a.remove();
  toast("Backup saved");
}
async function importBackup(file){
  const data = JSON.parse(decodeText(await file.arrayBuffer()));
  if (data.app !== "flashcards") throw new Error("Not a backup file");
  const images = await Promise.all((data.images || []).map(async i => ({name: i.name, blob: await (await fetch(i.data)).blob()})));
  await tx(["decks", "cards", "images", "meta"], "readwrite", ([ds, cs, is, ms]) => {
    ds.clear(); cs.clear(); is.clear(); ms.clear();
    data.decks.forEach(d => ds.put(d)); data.cards.forEach(c => cs.put(c));
    images.forEach(i => is.put(i)); (data.meta || []).forEach(m => ms.put(m));
  });
  urlCache.clear(); await loadSettings();
  toast("Backup restored");
}

/* ================= Views ================= */
const app = $("#app");
let view = {name: "home"};
let keyHandler = null;

async function showHome(){
  view = {name: "home"};
  keyHandler = null;
  const decks = (await getAll("decks")).sort((a, b) => a.name.localeCompare(b.name, "en"));
  const imgCount = (await getAll("images")).length;
  let html = `<header><h1>Flashcards Open</h1>
    <button class="btn small" id="settingsBtn" aria-label="Settings">⚙︎</button></header>
    <div class="row" style="margin-bottom:14px">
      <label class="btn primary fileb">＋ Import CSV<input type="file" id="csvIn" accept=".csv,.tsv,.txt,text/csv,text/plain" multiple></label>
      <label class="btn fileb">🖼 Add images<input type="file" id="imgIn" accept="image/*" multiple></label>
    </div>
    <div class="card-list" id="decks"></div>`;
  app.innerHTML = html;
  const list = $("#decks");
  if (!decks.length) list.innerHTML = `<div class="panel muted">No decks yet. Import a CSV file – every file becomes its own deck.</div>`;
  for (const d of decks){
    const cards = await cardsOf(d.id);
    const s = deckStats(cards);
    const el = document.createElement("div");
    el.className = "deck";
    el.innerHTML = `<h2>${esc(d.name)}</h2><div class="stats">
      <span class="s-new"><b>${s.newCards}</b> new</span><span class="s-learn"><b>${s.learn}</b> learning</span><span class="s-due"><b>${s.due}</b> due</span><span>${s.total} total</span></div>`;
    el.onclick = () => showDeck(d.id);
    list.appendChild(el);
  }
  app.insertAdjacentHTML("beforeend", `<p class="hint">${imgCount} image(s) stored. CSV: column 1 = front, column 2 = back, optionally column 3 = tags.
    The delimiter (<code>;</code> <code>,</code> tab) and the encoding (UTF-8 / Excel ANSI) are detected automatically.
    Markdown is rendered; images through <code>![](image.png)</code>, <code>[[image.png]]</code> or <code>&lt;img src="image.png"&gt;</code> – the file name has to match an image you added.
    Importing the same file name again updates the deck and keeps the study progress.</p>`);
  $("#csvIn").onchange = async (e) => { for (const f of e.target.files) { try { await importCSVFile(f); } catch(err){ toast("Error: " + err.message); } } showHome(); };
  $("#imgIn").onchange = async (e) => { await importImages(e.target.files); showHome(); };
  $("#settingsBtn").onclick = showSettings;
}

async function showSettings(){
  view = {name: "settings"};
  keyHandler = (k) => { if (k === "back") showHome(); };
  app.innerHTML = `<header><button class="btn small" id="back">←</button><h1>Settings</h1></header>
    <div class="panel"><label>New cards per day and deck<br><input type="number" id="npd" min="0" max="9999" value="${settings.newPerDay}"></label></div>
    <div class="panel"><b>Backup</b><p class="muted" style="margin:4px 0 10px">Progress lives in browser storage only. Back it up regularly – above all before you clear browser data.</p>
      <div class="row"><button class="btn" id="exp">Export backup</button>
      <label class="btn fileb">Restore backup<input type="file" id="impB" accept=".json,application/json"></label></div></div>
    <div class="panel"><b>Images</b><p class="muted" style="margin:4px 0 10px" id="imgInfo"></p><button class="btn danger" id="clrImg">Delete all images</button></div>`;
  const imgs = await getAll("images");
  $("#imgInfo").textContent = imgs.length + " image(s), " + (imgs.reduce((a, i) => a + i.blob.size, 0) / 1048576).toFixed(1) + " MB";
  $("#back").onclick = showHome;
  $("#npd").onchange = (e) => { settings.newPerDay = Math.max(0, parseInt(e.target.value) || 0); saveSettings(); toast("Saved"); };
  $("#exp").onclick = exportBackup;
  $("#impB").onchange = async (e) => { if (!e.target.files[0]) return; if (!confirm("All current data will be replaced by the backup. Continue?")) return; try { await importBackup(e.target.files[0]); showHome(); } catch(err){ toast("Error: " + err.message); } };
  $("#clrImg").onclick = async () => { if (!confirm("Delete all images?")) return; await tx("images", "readwrite", s => s.clear()); urlCache.clear(); showSettings(); };
}

async function showDeck(deckId){
  view = {name: "deck", deckId};
  keyHandler = (k) => { if (k === "back") showHome(); if (k === "show" || k === "good") startStudy(deckId, false); };
  const deck = (await getAll("decks")).find(d => d.id === deckId);
  const cards = await cardsOf(deckId);
  const s = deckStats(cards);
  const newLeft = Math.max(0, settings.newPerDay - await newDoneToday(deckId));
  const todayNew = Math.min(s.newCards, newLeft);
  const tags = [...new Set(cards.flatMap(c => c.tags.split(/[\s,]+/).filter(Boolean)))].sort((a, b) => a.localeCompare(b, "en"));
  app.innerHTML = `<header><button class="btn small" id="back">←</button><h1>${esc(deck.name)}</h1></header>
    <div class="panel"><div class="stats" style="font-size:1rem">
      <span class="s-new"><b>${todayNew}</b> new</span><span class="s-learn"><b>${s.learn}</b> learning</span><span class="s-due"><b>${s.due}</b> due</span></div>
      <div class="muted" style="font-size:.85rem;margin-top:4px">${s.total} cards · ${s.newCards} never studied</div></div>
    <div class="row" style="margin-bottom:10px">
      <button class="btn primary" id="go" style="flex:1">Study</button>
      <button class="btn" id="cram" style="flex:1">Cram all (no grading)</button></div>
    ${tags.length ? `<div class="panel"><label>Cram only cards with tag<br><select id="tagSel" style="width:100%;padding:10px;border-radius:10px;background:var(--surface);border:1px solid var(--border)"><option value="">all</option>${tags.map(t => `<option>${esc(t)}</option>`).join("")}</select></label></div>` : ""}
    <div class="row"><button class="btn" id="browse">Browse cards</button>
      <button class="btn" id="reset">Reset progress</button>
      <button class="btn danger" id="del">Delete deck</button></div>`;
  $("#back").onclick = showHome;
  $("#go").onclick = () => startStudy(deckId, false);
  $("#cram").onclick = () => startStudy(deckId, true, $("#tagSel") ? $("#tagSel").value : "");
  $("#browse").onclick = () => showBrowse(deckId);
  $("#reset").onclick = async () => { if (!confirm("Reset the study progress of this deck?")) return; await tx("cards", "readwrite", st => cards.forEach(c => st.put({...c, srs: newSRS()}))); showDeck(deckId); };
  $("#del").onclick = async () => { if (!confirm(`Delete the deck “${deck.name}”?`)) return; await tx(["decks", "cards"], "readwrite", ([ds, cs]) => { ds.delete(deckId); cards.forEach(c => cs.delete(c.id)); }); showHome(); };
}

async function showBrowse(deckId){
  view = {name: "browse"};
  keyHandler = (k) => { if (k === "back") showDeck(deckId); };
  const cards = (await cardsOf(deckId)).sort((a, b) => a.order - b.order);
  app.innerHTML = `<header><button class="btn small" id="back">←</button><h1>Cards (${cards.length})</h1></header>
    <input type="search" id="q" placeholder="Search…" style="margin-bottom:12px"><div class="card-list" id="list"></div>`;
  $("#back").onclick = () => showDeck(deckId);
  const list = $("#list");
  async function render(q){
    list.innerHTML = "";
    const ql = q.toLowerCase();
    const shown = cards.filter(c => !q || (c.front + " " + c.back + " " + c.tags).toLowerCase().includes(ql)).slice(0, 200);
    for (const c of shown){
      const el = document.createElement("div"); el.className = "browse-item";
      const f = document.createElement("div"), b = document.createElement("div"); b.className = "b";
      el.append(f, b);
      const due = c.srs.state === "new" ? "new" : (c.srs.due <= Date.now() ? "due" : "in " + fmtIvl(c.srs.due - Date.now()));
      el.insertAdjacentHTML("beforeend", `<div class="tags">${esc(c.tags)} · ${due}</div>`);
      list.appendChild(el);
      await renderMD(c.front, f); await renderMD(c.back, b);
    }
  }
  let t; $("#q").oninput = (e) => { clearTimeout(t); t = setTimeout(() => render(e.target.value), 200); };
  render("");
}

/* ================= Study ================= */
let S = null;
function shuffle(a){ for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
async function startStudy(deckId, cram, tag = ""){
  const all = await cardsOf(deckId);
  const now = Date.now(), eod = startOfTomorrow();
  let queue;
  if (cram){
    queue = shuffle(all.filter(c => !tag || c.tags.split(/[\s,]+/).includes(tag)));
  } else {
    const learn = all.filter(c => (c.srs.state === "learn" || c.srs.state === "relearn") && c.srs.due < eod).sort((a, b) => a.srs.due - b.srs.due);
    const review = shuffle(all.filter(c => c.srs.state === "review" && c.srs.due <= eod));
    const newLeft = Math.max(0, settings.newPerDay - await newDoneToday(deckId));
    const newCards = all.filter(c => c.srs.state === "new").sort((a, b) => a.order - b.order).slice(0, newLeft);
    // interleave new cards between reviews
    queue = [...learn];
    const r = [...review], n = [...newCards];
    while (r.length || n.length){ if (r.length) queue.push(r.shift()); if (r.length) queue.push(r.shift()); if (n.length) queue.push(n.shift()); }
  }
  if (!queue.length){ toast(cram ? "No cards" : "Nothing left due today 🎉"); return; }
  S = {deckId, cram, queue, idx: 0, total: queue.length, flipped: false, done: 0};
  view = {name: "study"};
  app.innerHTML = `<div id="study">
    <header style="margin-bottom:8px"><button class="btn small" id="back">←</button><h1 id="sTitle" class="muted" style="font-size:1rem"></h1></header>
    <div class="progress"><div id="prog"></div></div>
    <div class="fc" id="fc"><div id="front"></div><div id="backWrap" class="hidden"><hr class="sep"><div id="backC"></div></div><div class="tags" id="tagsC"></div></div>
    <button class="btn primary show-btn" id="showBtn">Show answer</button>
    <div class="answer-bar hidden" id="ans">
      <button class="btn b-again" data-r="1">Again<small id="i1"></small></button>
      <button class="btn b-hard" data-r="2">Hard<small id="i2"></small></button>
      <button class="btn b-good" data-r="3">Good<small id="i3"></small></button>
      <button class="btn b-easy" data-r="4">Easy<small id="i4"></small></button>
    </div>
    <div class="keys">Tap/space/Ⓐ = flip · 1–4 or Ⓑ Ⓧ Ⓐ Ⓨ = grade</div></div>`;
  $("#back").onclick = () => showDeck(deckId);
  $("#fc").onclick = (e) => { if (e.target.closest("a")) return; if (!S.flipped) flip(); };
  $("#showBtn").onclick = flip;
  $("#ans").onclick = (e) => { const b = e.target.closest("[data-r]"); if (b) rate(+b.dataset.r); };
  keyHandler = (k) => {
    if (k === "back") return showDeck(deckId);
    if (!S.flipped){ if (k === "show" || k === "good") flip(); return; }
    const r = {again: 1, hard: 2, good: 3, easy: 4}[k]; if (r) rate(r);
  };
  showCard();
}
async function showCard(){
  if (S.idx >= S.queue.length){
    keyHandler = (k) => { if (k) showDeck(S.deckId); };
    app.innerHTML = `<div class="done"><div class="big">🎉</div><h2>All done!</h2><p class="muted">${S.done} cards graded.</p><button class="btn primary" id="back">Back</button></div>`;
    $("#back").onclick = () => showDeck(S.deckId);
    return;
  }
  const c = S.queue[S.idx];
  S.flipped = false;
  $("#backWrap").classList.add("hidden"); $("#ans").classList.add("hidden"); $("#showBtn").classList.remove("hidden");
  $("#sTitle").textContent = (S.cram ? "Cram · " : "") + (S.queue.length - S.idx) + " left";
  $("#prog").style.width = (S.idx / S.queue.length * 100) + "%";
  $("#tagsC").textContent = c.tags;
  $("#fc").scrollTop = 0;
  await renderMD(c.front, $("#front"));
  await renderMD(c.back, $("#backC"));
}
function flip(){
  if (!S || S.flipped) return;
  S.flipped = true;
  $("#backWrap").classList.remove("hidden"); $("#showBtn").classList.add("hidden"); $("#ans").classList.remove("hidden");
  const c = S.queue[S.idx];
  if (S.cram){ ["i1","i2","i3","i4"].forEach(i => $("#" + i).textContent = ""); return; }
  const now = Date.now();
  for (let r = 1; r <= 4; r++) $("#i" + r).textContent = fmtIvl(schedule(c.srs, r, now).due - now);
}
async function rate(r){
  if (!S || !S.flipped) return;
  const c = S.queue[S.idx];
  S.done++;
  if (S.cram){
    if (r === 1) S.queue.splice(Math.min(S.queue.length, S.idx + 4), 0, c);
  } else {
    const wasNew = c.srs.state === "new";
    c.srs = schedule(c.srs, r);
    await putCard(c);
    if (wasNew) await incNewToday(S.deckId);
    // requeue learning cards that fall due again today
    if ((c.srs.state === "learn" || c.srs.state === "relearn") && c.srs.due < startOfTomorrow()){
      const pos = Math.min(S.queue.length, S.idx + 1 + (r === 1 ? 3 : 6));
      S.queue.splice(pos, 0, c);
    }
  }
  S.idx++;
  showCard();
}

/* ================= Input: keyboard + gamepad ================= */
document.addEventListener("keydown", (e) => {
  if (!keyHandler || /^(INPUT|SELECT|TEXTAREA)$/.test(e.target.tagName)) return;
  const map = {" ": "show", "Enter": "show", "1": "again", "2": "hard", "3": "good", "4": "easy", "Escape": "back", "Backspace": "back",
    "GoBack": "back", "BrowserBack": "back"};
  const k = map[e.key];
  if (k){ e.preventDefault(); keyHandler(k); }
});
// standard gamepad: 0=A 1=B 2=X 3=Y 8=Select 9=Start  (Xbox layout, as on most Android handhelds)
const PAD = {0: "good", 1: "again", 2: "hard", 3: "easy", 8: "back", 12: "show", 13: "show"};
let padPrev = {};
function pollPad(){
  const pads = navigator.getGamepads ? navigator.getGamepads() : [];
  for (const p of pads){
    if (!p) continue;
    p.buttons.forEach((b, i) => {
      const id = p.index + ":" + i;
      if (b.pressed && !padPrev[id] && PAD[i] && keyHandler) keyHandler(PAD[i]);
      padPrev[id] = b.pressed;
    });
  }
  requestAnimationFrame(pollPad);
}
window.addEventListener("gamepadconnected", () => toast("Controller detected"));

/* ================= Start ================= */
(async () => {
  try {
    db = await openDB();
    await loadSettings();
    if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
    showHome();
    requestAnimationFrame(pollPad);
  } catch(e){
    app.innerHTML = `<div class="panel">Storage unavailable (${esc(e.message || e)}). Please open the file in Chrome or Firefox, not in private mode.</div>`;
  }
})();
</script>
